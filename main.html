const FM=["Hydrides","Catalytic hydrogenation","Dissolving metals","Metal / acid","Named / other"];
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let cur="db",two="",q="",cat="All",only=false;
function cell(r,g){const e=R[r].t[g];if(e)return`<span class="p">${esc(e[0])}</span>${e[2]?'<span class="tag">†</span>':""}<span class="rs">${esc(e[1])}</span>`;return`<span class="nr">No reaction</span><span class="rs">${esc(G0[g]||R[r].nr)}</span>`}
function view(){const r=R[cur],cats=["All",...new Set(GR.map(x=>x[0]))];
let h="";FM.forEach(f=>{h+=`<p class="grp">${f}</p><div class="chips">`+Object.keys(R).filter(k=>R[k].f==f).map(k=>`<button class="chip" aria-pressed="${k==cur}" data-r="${k}">${esc(R[k].n)}</button>`).join("")+"</div>"});

h+=`<div class="hd"><b>${esc(r.n)}</b><p>${esc(r.s)}</p></div><div class="bar"><input type="search" id="q" placeholder="Search a functional group" value="${esc(q)}" aria-label="Search functional group"><select id="cat" aria-label="Category">${cats.map(c=>`<option${c==cat?" selected":""}>${c}</option>`).join("")}</select><label><input type="checkbox" id="on"${only?" checked":""}> Only groups that react</label><select id="two" aria-label="Compare with"><option value="">Compare with…</option>${Object.keys(R).filter(k=>k!=cur).map(k=>`<option value="${k}"${k==two?" selected":""}>${esc(R[k].n)}</option>`).join("")}</select></div><div class="${two?"cmpm":""}">`;
let last="";GR.forEach(([c,g,n])=>{if(cat!="All"&&c!=cat)return;if(q&&!n.toLowerCase().includes(q.toLowerCase()))return;if(only&&!r.t[g]&&!(two&&R[two].t[g]))return;
if(c!=last){h+=`<div class="cat">${c}</div>`;last=c}
h+=`<div class="row"><div class="g">${esc(n)}</div><div>${cell(cur,g)}</div>${two?`<div>${cell(two,g)}</div>`:""}</div>`});
if(two)h=h.replace('<div class="cmpm">',`<div class="cmpm"><div class="row" style="background:var(--ac2)"><div class="g">Functional group</div><div class="g">${esc(r.n)}</div><div class="g">${esc(R[two].n)}</div></div>`);
app.innerHTML=h+"</div>"}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-r]");if(b){cur=b.dataset.r;if(two==cur)two="";view()}});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="q"){q=t.value;const p=t.selectionStart;view();const n=$("#q");n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{const t=e.target;if(t.id=="cat")cat=t.value;else if(t.id=="on")only=t.checked;else if(t.id=="two")two=t.value;else return;view()});
view();
</script></body></html>
